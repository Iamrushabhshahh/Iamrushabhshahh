name: Latest blog posts

on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gautamkrishnar/blog-post-workflow@v1
        with:
          feed_list: "https://rushabhshah.dev/blog/rss.xml"
          max_post_count: 5
          committer_username: "Iamrushabhshahh"
          committer_email: "rushabhshah842@gmail.com"
          commit_message: "chore: update latest blog posts"
